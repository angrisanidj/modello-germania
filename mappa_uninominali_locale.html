<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mappa locale Wahlkreise</title><style>html,body{margin:0;background:#fbfbf9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#151515}#wrap{position:relative;min-height:620px;display:grid;place-items:center}.note{position:absolute;left:14px;top:12px;font-size:11px;color:#514b3a;background:#fff8dc;border:1px solid #ead887;border-radius:999px;padding:7px 10px;z-index:2;font-weight:700}svg{width:100%;max-width:720px;height:auto}.cell{stroke:#fff;stroke-width:1.3;cursor:pointer}.cell:hover{stroke:#111;stroke-width:2}.tip{position:fixed;display:none;background:#111;color:#fff;padding:8px 10px;border-radius:8px;font-size:11px;pointer-events:none;z-index:5}.empty{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:#777;text-align:center;width:min(90%,700px)}</style></head><body><div id="wrap"><div class="note">Cartogramma locale · 299 Wahlkreise</div><svg id="map" viewBox="0 0 640 760" aria-label="Cartogramma locale dei 299 Wahlkreise"></svg><div id="tip" class="tip"></div><div class="empty">Fallback locale: garantisce la presenza dei 299 collegi anche senza risorse esterne. Se la dashboard invia una proiezione, i collegi vengono colorati; in caso contrario restano neutri. Non riproduce i confini geografici reali.</div></div><script>
const COLORS={union:'#111111',afd:'#009EE0',spd:'#E3000F',gruene:'#64A12D',linke:'#BE3075',bsw:'#792350',fdp:'#FFCC00',fw:'#F39200',ssw:'#003C8F',other:'#b9bdc2'};let DATA={};
function paths(){const rows=[7,9,11,13,15,17,19,21,22,23,23,22,21,19,17,15,13,12],W=640,H=760,padY=32,rowH=(H-padY*2)/rows.length,cellW=22,out=[];let id=1;const hex=(cx,cy,r)=>{let pts=[];for(let i=0;i<6;i++){let a=Math.PI/3*i+Math.PI/6;pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return'M'+pts.map((p,i)=>(i?'L':'')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')+'Z'};rows.forEach((n,ri)=>{let step=Math.min(cellW,(W-68)/n),start=(W-step*(n-1))/2;for(let j=0;j<n&&id<=299;j++,id++){let cx=start+j*step,cy=padY+ri*rowH+(ri%2?4:0);out.push({id,d:hex(cx,cy,Math.min(10,rowH*.32))})}});return out}
function render(){const svg=document.getElementById('map');svg.innerHTML=paths().map(x=>{const d=DATA[x.id]||{},c=COLORS[d.winner]||'#d8dadd';return`<path class="cell" data-id="${x.id}" d="${x.d}" fill="${c}"/>`}).join('');svg.querySelectorAll('.cell').forEach(p=>{p.onpointermove=e=>{const d=DATA[p.dataset.id]||{},t=document.getElementById('tip');t.style.display='block';t.style.left=(e.clientX+12)+'px';t.style.top=(e.clientY+12)+'px';t.textContent=d.name?`Wahlkreis ${p.dataset.id} · ${d.name} · ${d.label||d.winner||'—'}`:`Wahlkreis ${p.dataset.id}`};p.onpointerleave=()=>document.getElementById('tip').style.display='none'})}
addEventListener('message',e=>{if(e.data&&e.data.type==='wahlkreise-data'){DATA=e.data.districts||{};render()}});render();
</script></body></html>
