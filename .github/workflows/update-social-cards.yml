name: Update model social cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,17 * * *"
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/generate-social-cards.mjs
      - .github/workflows/update-social-cards.yml

permissions:
  contents: write

concurrency:
  group: model-social-cards
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve model locally
        run: |
          python3 -m http.server 8000 >/tmp/model-http.log 2>&1 &
          echo $! > /tmp/model-http.pid
          sleep 2
      - name: Generate cards from the model
        run: node scripts/generate-social-cards.mjs
      - name: Commit changed social cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-card-bundestag-v2.png social-card-bundestag-instagram-v2.png share-*.html
          if git diff --cached --quiet; then
            echo "Social cards already current"
            exit 0
          fi
          git commit -m "chore: refresh model-generated social cards [social-card]"
          git push
